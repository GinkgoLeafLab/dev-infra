name: review-gate (reusable)

# 把 code-reviewer 的「通过」结论变成一个挂在 PR head SHA 上的必需检查 `review`。
# 各仓库只留一个十几行的 caller，逻辑只有这一份。
#
# 调研与取舍见 GTO-Trainer 仓的 docs/方案/2026-08-PR-评审强制.md、
# docs/方案/2026-09-放行检查改用-commit-status.md 与
# docs/方案/2026-09-跨仓库基础设施复用.md。
#
# ---------------------------------------------------------------------------
# caller 必须自己提供这三样，**一样都不能搬进来**
# ---------------------------------------------------------------------------
#
# 1. `on: pull_request_target: types: [labeled, synchronize]`
#    可复用工作流没有自己的触发器，事件永远来自 caller。
#    **必须是 pull_request_target 不是 pull_request**：前者的定义取自默认分支，
#    后者能让一个 PR 改写自己那份 caller 来放行自己。
#
#    **两个事件各走一条路，缺一条那条路就永远不跑，而且不报错**：
#
#    | 事件 | 这份文件里做什么 |
#    |---|---|
#    | `labeled` + `review-passed` | 在 head SHA 上写 `review` = success（评审通过） |
#    | `synchronize`（推了新 commit） | 读 PR 写锁，判这次推送有没有让在飞的评审结论作废 |
#
#    **`synchronize` 漏了的后果**：PR 写锁那条路（本仓 v1.11.0 加的）永远不会执行。
#    它防的正是「作者在评审跑的时候推了新 commit、这一轮结论作废」——
#    `GTO-Trainer#182` 一份纯文档走了 9 轮、两轮已判「通过」后作废，就是这件事。
#    少了它没有任何报错，那把锁只是安静地不存在。
#
# 2. **job 级的 `if:`，两半都要**：
#
#    ```yaml
#    if: github.event.label.name == 'review-passed' || github.event.action == 'synchronize'
#    ```
#
#    这一条是**账单前提，不是过滤器**：job 级的 if 为 false 时 runner 根本不会起、
#    不计分钟数（GitHub 员工在官方社区论坛 orgs/community discussion #26456 的原话：
#    "those workflows never start up a runner, so they do not count towards the
#    included minutes"，**来源等级低于定价页正文**）。
#    搬进这份文件就变成「起了 runner 再判断」——功能完全正常，只有账单变了，
#    而且没有任何症状。别搬。
#
#    **后半句是最容易漏的一处**：`synchronize` **不是标签事件**，所以
#    `github.event.label.name` 是 `null`——只写前半句的话，那个事件会被整个挡在门外。
#    前两条（`types` 加了、`uses:` 也升了）看上去「什么都配好了」，而这一行让它们全白做。
#
# 3. `permissions: { statuses: write, pull-requests: write }` 写在**调用这份文件的那个 job 上**
#    官方原话："If `jobs.<job_id>.permissions` is not specified in the calling job,
#    the called workflow will have the default permissions for the `GITHUB_TOKEN`."
#    以及 "The `GITHUB_TOKEN` permissions passed from the caller workflow can be only
#    downgraded (not elevated) by the called workflow."
#    ——所以在这里写 permissions 是没用的：给多了升不上去，给少了反而是降级。
#    caller 漏写的表现是这个 job 403 变红、检查写不上、PR 被拦住——**失败方向是安全那边**。
#
#    **`pull-requests: write` 现在担两件事**：摘 `review-passed` 标签，
#    以及 PR 写锁那条路上**读 PR 的评论**（锁的元数据住在一条评论里）。
#    少了它，`synchronize` 那条路会 403 变红 → 新 SHA 上没有 `review` → PR 被拦住。
#    （拉取本仓的组合动作不走这枚 token，所以**不需要 `contents`**。）
#
# 这份文件为什么读得到 caller 的事件：官方原话
# "When a reusable workflow is triggered by a caller workflow, the `github` context
# is always associated with the caller workflow."
# 以及 "The called workflow is automatically granted access to `github.token` and
# `secrets.GITHUB_TOKEN`."——所以下面那些 github.event.* 取到的是 **caller 触发这次的那一个事件**
# （`labeled` 或 `synchronize`，这正是上面第 1、2 条要按事件分流的原因），
# 而且不需要 caller 写 `secrets: inherit`。
#
# ---------------------------------------------------------------------------
# 为什么是一个检查而不是 approve
# ---------------------------------------------------------------------------
#
# 1. **缺席即拦**。必需检查没被报告时，PR 停在 "Expected — waiting for status" 上合不了。
#    所以「从没派过评审」这种 PR 默认就是拦住的，不需要任何人做任何事。
#    换成 required approvals 也有这个性质，但那个动作必须来自非作者身份，
#    要为它建 GitHub App、管私钥；而写一条 commit status 用 Actions 自带的
#    GITHUB_TOKEN 就够。
# 2. **它挂在 commit SHA 上**，这正是「审的是这一版」的天然表达：
#    推一个新 commit，新 SHA 上没有它，PR 立刻变回拦住状态。
#    不用依赖 "dismiss stale approvals" 那种补丁。
#
# **为什么是 commit status 而不是 check run**：在 GTO-Trainer 仓实测过——那个仓库的
# 必需检查**不匹配**用 Checks API 现写的 check run（#67 / #68 上它确实存在于 head SHA、
# 结论正常，merge box 照样说「Expected — Waiting for status to be reported」，
# 而同一个 PR 上 job 产出的 `test` 匹配得上）；换成 commit status 之后 #69 当场变 clean。
# **原因没查到出处**，所以这条只能靠「实测过、别改回去」拦——
# 改回去 PR 就再也合不了，而这个 gate job 还是绿的。

# ---------------------------------------------------------------------------
# 两条路：打 review-passed 是「通过」，推新 commit 是「检查结论还算不算数」
# ---------------------------------------------------------------------------
#
# **这个 workflow 现在响应两种 caller 事件，做什么完全不同**：
#
# | caller 的 trigger | 这个 job 做什么 |
# |---|---|
# | `labeled` + `review-passed` | 在 head SHA 上写 `review` = success（评审通过） |
# | `synchronize`（推了新 commit） | 读 PR 写锁，判这次推送有没有让在飞的评审结论作废 |
#
# 第二条是**PR 写锁**。加它的理由（那是真事故）：`GTO-Trainer#182` 一份纯文档走了
# 9 轮评审，**其中两轮已判「通过」，都因为作者随后推了新 commit 而作废**——
# 因为「有人正在审」这件事没人知道，评审在飞的那十几分钟里作者可以自由推进。
# 调研与取舍见本仓 docs/方案/2026-09-PR-写锁.md。
#
# **它不阻止 push，也阻止不了**：实测 ruleset 只覆盖 `~DEFAULT_BRANCH`（推在特性分支上
# 的提交不受它管），而且必需检查的语义是「不能合并」不是「不能 push」——官方文档
# *Available rules for rulesets* 原话是 "all required status checks must pass before
# collaborators can **merge** changes into the branch or tag"。
# 所以它的作用是**让「你的结论已作废」当场上报**，把这个事实从「作者事后自己算」
# 变成「一条当场变红的必需检查」。

on:
  workflow_call:

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # permissions 不写在这儿，见上面第 3 条。
    steps:
      # gh 和 jq 都是 GitHub hosted runner 预装的，不是这里装的东西。
      #
      # 钉死 head.sha 而不是让 API 自己找：如果打标签的同时有人推了新 commit，
      # 检查会落在旧 SHA 上，PR 仍然是拦住的——**失败方向是安全的那一边**。
      #
      # 用 jq 拼 JSON 再 --input -，**不要**写成 `gh api -f 'output[title]=…'`：
      # gh 对非 GET 请求是把 -f 收集成一个扁平 map 直接 json.Marshal
      # （cli/cli 的 pkg/cmd/api/http.go，那里有一句注释写着嵌套子键的支持
      # "can be added here if that is ever necessary"——也就是还没做）。
      # 方括号不展开，发出去就是一个字面 key，而 GitHub 忽略未知字段，
      # 结果是**检查照样创建、绿勾照常，只有 output 静默丢掉**——最难发现的那种失败。
      # jq 顺带把登录名的转义也接过去了。
      #
      # 走环境变量而不是把登录名直接插进 run：那是注入口子。
      #
      # **只在 labeled 那条路上跑。** synchronize（推了新 commit）走下面那组步骤——
      # 它要做的是「判这次推送有没有让在飞的评审作废」，不是「通过」。
      - name: 在 head SHA 上写 review commit status
        if: github.event.action != 'synchronize'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.event.pull_request.head.sha }}
          ACTOR: ${{ github.event.sender.login }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        # description 限 140 字符，超了整个请求会被 GitHub 拒——展开的理由指回这次 run。
        run: |
          jq -n --arg actor "$ACTOR" --arg url "$RUN_URL" '{
            state: "success",
            context: "review",
            description: ("评审通过：由 @" + $actor + " 打上 review-passed 标签触发"),
            target_url: $url
          }' | gh api "repos/$REPO/statuses/$SHA" --input -

      # 标签是**一次性信号**，不是状态：摘掉它，下一轮要放行必须重新打。
      # 不摘的话，推了新代码之后标签还挂在那儿显示「已通过」，而新 SHA 上根本没有检查——
      # 那就是一句假话，比没有标签更糟。
      #
      # always()：写检查失败也摘。失败时 job 是红的、看得见，而留着标签只会让人
      # 以为已经放行了；重新打一次标签就是重试。
      #
      # 摘标签走 GITHUB_TOKEN，它触发的事件不会再产生新的 workflow run
      # （GitHub 文档：events triggered by the GITHUB_TOKEN will not create a new
      # workflow run），所以不会和 caller 的 labeled 触发器绕成环。
      - name: 摘掉标签
        if: always() && github.event.action != 'synchronize'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
        run: gh api -X DELETE "repos/$REPO/issues/$PR/labels/review-passed"

      # ---------------------------------------------------------------------
      # PR 写锁：推了新 commit 时，判这次推送有没有让在飞的评审结论作废
      # ---------------------------------------------------------------------
      #
      # 判定逻辑在组合动作里（有测试钉着），这里只负责**把它的输入取回来、
      # 把它的输出交出去**。为什么判定不能写在 YAML 里见 review-gate-lock/lock.js 顶部。
      #
      # **这里要读评论**，所以这个 job 需要读评论的权限（官方权限名叫 `pull-requests`，
      # caller 那条 `pull-requests: write` 盖得住）。
      # 读不到评论时一律落到空数组：判定会把「读不到锁」当作**没有锁**。
      # **失败方向是少一层保护，不是误拦 PR**——锁挂了不能让所有 PR 合不了。
      # （对比 qa-gate 那边是反过来的：那边失败必须拦住，因为那是放行门。）
      - name: 读 PR 写锁
        if: github.event.action == 'synchronize'
        id: lock
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          # **`--paginate` 配 `--jq` 出来的不是一段合法 JSON**：gh 是把每一页的
          # jq 结果**各自序列化后首尾相接**吐出来的。页数 > 1 时那串东西
          # `JSON.parse` 直接抛（实测过：`[{"body":"a"}]\n[{"body":"b"}]`）。
          # 所以分页要自己接：`--paginate` 只用来把页取全，用 `-q` 把每页拼成
          # 一个**流式**的 JSON 数组再整体 slurp。
          #
          # 分页不是可选的：评论可能上百条，锁评论未必在前 30 条里
          # （这次事故那个 PR 上就有 26 条 review、60+ 条噪音）。
          # 漏读的后果是「有锁却判成没有锁」——静默失效。
          #
          # 拼失败（网络、权限）时落到 `[]`，也就是「没有锁」，见上面那段。
          BODY=$(gh api --paginate "repos/$REPO/issues/$PR/comments" \
                   -q '[.[] | {body: .body}]' 2>/dev/null \
                 | jq -s 'add // []' 2>/dev/null) || BODY=""
          [ -n "$BODY" ] || BODY='[]'

          # **多行/含特殊字符的值必须用 heredoc 定界符写**，不能写 `comments=$BODY`：
          # $GITHUB_OUTPUT 是一行一条的格式，值里带换行会让 GitHub 直接拒掉这一步
          # （报 "Invalid format"）。而评论体里**一定有换行**——那正是它的用处。
          # 定界符用一个不会出现在 JSON 里的串。
          {
            echo "comments<<__LOCK_EOF__"
            echo "$BODY"
            echo "__LOCK_EOF__"
          } >> "$GITHUB_OUTPUT"

      - name: 判这次推送有没有让在飞的评审作废
        if: github.event.action == 'synchronize'
        uses: $/.github/actions/review-gate-lock
        with:
          # **before 和 after 都必须是 caller 那次 synchronize 事件里的值**：
          # 判「作废」靠的是拿锁的 base 比 before（被推掉的那一版），
          # 不是比 after——推送之后 head 已经变了，拿它比永远不等。
          base: ${{ github.event.before }}
          head: ${{ github.event.pull_request.head.sha }}
          # **快照，不是现读**：同 qa-gate/action.yml 里那段注释，事件发出来之后
          # 现读拿到的已经不是当时那一份。
          previous-labels: ${{ toJSON(github.event.pull_request.labels.*.name) }}
          comments: ${{ steps.lock.outputs.comments }}
        id: decide

      # 钉死 head.sha（和上面那条通过检查同一个理由）：这次推送之后的 head。
      # 写不上去就是 job 红 → 新 SHA 上没有 `review` → PR 停在
      # "Expected — waiting for status" → **拦住，不是放行**。
      #
      # **只在 `has_body == 'true'` 时才跑这一步——结论是 OK 时什么都不写。**
      # 这条曾经缺过：以前这一步无条件对每次 synchronize 都调 `gh api`，
      # 而 lock.js 对任何结论（包括「没有评审在飞」）都会吐一份 JSON、
      # 而且 OK 那一档写的是 `state: "success"`。后果是一个从没派过评审的 PR，
      # 只要推过一次 commit，`review` 就是绿的——`review` 唯一的保证「缺席即拦」
      # 就这么被废掉了，而且没有任何症状（实证：GTO-Trainer#186 的 run
      # `35579432642`，`LOCK_PRESENT: false` 却写出 `state: "success"`；
      # `GTO-Trainer#191` 又复现了一次）。现在 lock.js 对 OK 不吐任何 JSON，
      # `has_body` 就是照这一点算出来的（见 review-gate-lock/action.yml）。
      #
      # **就算这个 `if` 被人删掉，这一步也不会悄悄放行**：`has_body=false` 时
      # `body_path` 指向的是一个空文件，`gh api --input` 拿它当请求体发出去，
      # GitHub 的 statuses 接口缺 `state` 字段会拒掉这次请求（非 2xx），
      # `gh api` 对非 2xx 默认非零退出（`cli/cli` 的 `pkg/cmd/api/api.go`），
      # job 照样红、新 SHA 上照样没有 `review`——**拦住，不是放行**，
      # 判定因此不是只活在这一行 YAML 里。
      - name: 在新 head 上写 review commit status
        if: github.event.action == 'synchronize' && steps.decide.outputs.has_body == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.event.pull_request.head.sha }}
          BODY: ${{ steps.decide.outputs.body_path }}
        run: gh api "repos/$REPO/statuses/$SHA" --input "$BODY"

      # 锁是**超时**释放的，不是评审者放的——要留一条痕。
      # 不留的话「锁自己消失了」会变成新的静默失败：作者只看到 `review` 缺席，
      # 却不知道那是「没人审」还是「审的人崩了」。
      # （超时释放走的是 OK 那一档，上面那一步因此什么都不写；
      #   **而这一步的 `if` 不看 `has_body`**，所以留痕照跑。）
      - name: 超时释放要留痕
        if: github.event.action == 'synchronize' && steps.decide.outputs.release_expired == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        # 摘标签 + 说明为什么摘。走 GITHUB_TOKEN 不会再触发新的 run，不会绕成环。
        # **`|| true` 是刻意的**：这一步失败不该把整个 job 打红——job 红了意味着
        # 「检查没写上」，而上面那条检查其实已经写成功了。留痕失败是次要的，
        # 让它把检查的存在性拖下水才是本末倒置。
        run: |
          gh api -X DELETE "repos/$REPO/issues/$PR/labels/review%2Fin-flight" || true
          gh api "repos/$REPO/issues/$PR/comments" \
            -f body="评审锁已**超时自动释放**（评审者没有自己放锁，多半是评审中断了）。这一版不再受它保护。见 [$RUN_URL]($RUN_URL)。" || true
