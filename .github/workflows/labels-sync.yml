name: labels-sync (reusable)

# 把共享的标签清单同步成调用方仓库的 GitHub 标签。
# 各仓库只留一个二十来行的 caller，清单与逻辑都只有这一份。
#
# 调研与取舍见 GinkgoLeafLab/GTO-Trainer 仓的
# docs/方案/2026-09-标签用清单管理.md 与
# docs/方案/2026-09-跨仓库基础设施复用.md。
#
# **它只加和改，永远不删。** 理由在 .github/actions/labels-sync/labels-sync.js
# 顶部：删标签会把它从所有 issue 上摘掉，不可逆，而现成的同步工具多数默认就是删的。
#
# ---------------------------------------------------------------------------
# caller 必须自己提供这两样
# ---------------------------------------------------------------------------
#
# 1. `on:` —— 可复用工作流没有自己的触发器，事件永远来自 caller。
#    **这条流水线可以用 `paths`**（`test.yml` / `qa-gate.yml` 上那条禁令不适用）：
#    那条禁令的理由是必需检查被 workflow 级过滤跳过会停在
#    "Expected — waiting for status"，而这条**永远不是必需检查、也不在 PR 上跑**。
#    **但那个理由不可外推**，别拿它去给别的流水线加 paths。
#
# 2. `permissions: { issues: write }` 写在**调用这份文件的那个 job 上**
#    官方明写权限取自 calling job，被调用方**只能降不能升**，写在这里没用。
#
#    **注意这里不要 `contents`。** 清单和脚本都跟着组合动作下发，
#    这条路上一次 checkout 都不做——和 qa-gate 同形。给了也用不上。
#
# 这个 workflow 不写任何 commit status，也不是任何仓的必需检查：
# 它是一个**动作**，不是一个判断。坏了的表现是标签没同步上，不是 PR 合不了。

on:
  workflow_call:
    inputs:
      qa-labels:
        description: >-
          这个仓要不要 qa-required / qa-passed。**只有装了 qa-gate 的仓才给 true**，
          理由见组合动作的 action.yml。
        required: false
        type: boolean
        default: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # permissions 不写在这儿，见上面第 2 条。
    steps:
      # 先 dry-run 打一遍计划：出了问题，日志里看得见「本来要做什么」。
      # 两步用的是同一个动作、同一份清单，差别只有 apply。
      # 这个组合动作和这份工作流住在同一个仓库、同一个 commit，用 GitHub 的
      # 自引用语法 `$/`——解析到「这份文件所在的仓库，运行时那个 commit」，
      # 不看任何 tag，所以这条路上不再有「前向引用」这回事（对比：以前按
      # `@vX.Y.Z` 引用时这一行写的是「这个 commit 打算被发成哪个 tag」，
      # 合并那一刻 tag 还不存在；`v1.1.0` 就是把它写成 `@v1` 才发坏的——
      # `v1` 指着组合动作还不存在的那个 commit）。**不能带 `@{ref}` 后缀**
      # （官方原文：a `$/` reference must not include an `@{ref}` suffix），
      # **不能写成 `./`**（相对路径对着工作区解析，这条路上没人被 checkout）。
      # labels.test.js 的 L3/L9 钉着「必须是 $/ 精确自引用」。
      - name: 看看要做什么（dry-run）
        uses: $/.github/actions/labels-sync
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          qa-labels: ${{ inputs.qa-labels }}
          apply: "false"

      - name: 同步
        uses: $/.github/actions/labels-sync
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          qa-labels: ${{ inputs.qa-labels }}
          apply: "true"
