name: test

# 这个仓库装的东西一旦坏掉，**是所有消费仓的门一起坏**，而且多数失效是静默的
# （判定判反了 → 一个标了「必须测」的 PR 拿到绿检查）。所以这里必须有一条自己的测试。
#
# 它跑两类套件，清单以下面的 steps 为准。一类是第一层的（qa-gate、labels-sync、
# review-gate-lock 与 docs-only）：既验各自的判定/同步逻辑，
# 也把接线本身验一遍（不许加 checkout、组合动作按 `$/` 自引用同仓的自己、
# 脚本与清单走 $GITHUB_ACTION_PATH；docs-only 那份是把 action.yml 里那段 run
# 抽出来真跑一遍）。理由逐条写在那四份文件里。
#
# **review-gate-lock 那一份的失效方向要单独说**：它判错的后果是「该报的
# 评审作废没报」，PR 上的 `review` 照常绿着、作者以为结论还算数——
# 那正是 GTO-Trainer#182 走了 9 轮的那个事故原样复发，且没有症状。
# 它钉得最重的一条是**比对的方向**：判作废要拿锁的 base 比**被推掉的那一版**，
# 写成比推送后的 head 就永远不等，整把锁安静地什么都不做。
#
# 另一类是 `shared/` 里第二层那份源文件自带的测试（`guard-branch.test.js`）。各消费仓
# 把 submodule 指针挪到这个 commit 之后**也会跑它**（它就在 submodule 检出的内容里，
# 落在各仓自己的套件清单里），所以这里跑它不是唯一的一道——**它是更早的那一道**：
# 各仓要等这里打出新 tag、并且真的把 submodule 指针挪过去之后才跑得到，而这里在
# 合并那一刻就跑。拿掉它，一份坏掉的守卫会一直绿到某个仓挪指针的那一天。
#
# **这个检查现在还不是必需检查**——那要人去仓库设置里点。没钉之前它只是「看得见」，
# 不是「拦得住」，别把它当成守卫已经生效了。

on:
  pull_request:
  push:
    branches: [main]

# 不许加 paths / paths-ignore：哪天它被钉成必需检查，被 workflow 级过滤跳过的 PR 上
# 这个检查根本不会产生，表现为永远 pending、那个 PR 永远合不了。
# 这条禁令在各消费仓的 test.yml 上是同一条。

permissions:
  contents: read

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # **不再需要 `fetch-tags: true`。** 它以前是 qa-gate.test.js 的 W8 与
      # labels.test.js 的 L9 的前提——那两条按 git tag 读「内层 `uses:` 指的那个
      # tag 上真的有这个动作吗」，没有 tag 时会把每一次都当成「前向引用」放过去，
      # dev-infra#3 修的就是这条缝。
      #
      # `.github/workflows/qa-gate.yml` 与 `labels-sync.yml` 内层那三行自引用
      # 换成 `$/` 之后（调研见 GinkgoLeafLab/GTO-Trainer 的
      # docs/方案/2026-09-第一层要不要也走-subtree.md），
      # 这两条检查不再按 tag 读内容，改成验「`$/` 引用的路径在这个仓库里真的
      # 存在 action.yml」——纯静态路径判断，不需要 git、更不需要 tag。
      # 拿掉这一行不会让任何东西静默变瞎：那两条测试今天不读 git tag。
      - uses: actions/checkout@v7

      # 不加 setup-node：这些脚本零依赖、只用 fs / path / child_process，
      # 而且**生产上它们跑在 runner 自带的 node 上**（组合动作里没有 setup-node，
      # 加了就要求每个消费仓的 job 多跑一步）。这里也用自带的那个，
      # 两边才是同一个环境——钉一个这里有、那里没有的版本反而制造了差异。
      # 每个套件各写一步、`if: always()` 一个都不能省：用 `&&` 串起来的话前面挂了
      # 后面**根本不执行**，而终端看上去就是「测试挂了」，没人知道另一半整轮没被验过
      # （GinkgoLeafLab/GTO-Trainer 的 scripts/test-all.js 顶部记着这次真实事故）。
      - name: QA 门禁判定
        run: node .github/actions/qa-gate/qa-gate.test.js

      - name: 标签同步
        if: always()
        run: node .github/actions/labels-sync/labels.test.js

      # 这一条也验接线：锁标签必须在共享清单里（GitHub 对打一个不存在的标签是
      # **静默不打**——漏了它的表现是「评审者打了标签、标签根本没上去、
      # 于是永远判没有锁」，整把锁形同虚设而且没有症状）。
      - name: PR 写锁
        if: always()
        run: node .github/actions/review-gate-lock/lock.test.js

      # 这一条会在临时目录里 git init 一个真仓库、真的提交几次——
      # `-z` 与 `--no-renames` 那两条只有拿真 git 跑才测得出来，纯函数测不到。
      # 它还会把 action.yml 里那段 run 抽出来用 bash 跑一遍（各仓 workflow 里
      # 只剩一行 `uses:`，参数是那段 bash 拼的，拼错了没有一个仓看得见）。
      - name: 纯文档判定
        if: always()
        run: node .github/actions/docs-only/docs-only.test.js

      # 这一条验的不是这个仓库自己跑得对不对，而是**各消费仓把它当 submodule 挂上之后
      # 会拿到什么**：钩子的可执行位、行尾、钩子目录的白名单。三件事失效的时候
      # 这个仓库一切正常，只有消费仓那边才暴露，而且都不报错。
      - name: submodule 形态
        if: always()
        run: node submodule-shape.test.js

      # 下面跑的是 shared/ 那份源文件自己的测试。
      - name: 分支守卫（shared/）
        if: always()
        run: node shared/guard-branch.test.js
