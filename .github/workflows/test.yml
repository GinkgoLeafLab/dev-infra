name: test

# 这个仓库装的东西一旦坏掉，**是所有消费仓的门一起坏**，而且多数失效是静默的
# （判定判反了 → 一个标了「必须测」的 PR 拿到绿检查）。所以这里必须有一条自己的测试。
#
# 它跑的是 .github/actions/qa-gate/qa-gate.test.js：既验判定逻辑，
# 也用源码断言钉住接线的形状（不许加 checkout、按 tag 引用动作、脚本走
# $GITHUB_ACTION_PATH）。理由逐条写在那份文件里。
#
# **这个检查现在还不是必需检查**——那要人去仓库设置里点。没钉之前它只是「看得见」，
# 不是「拦得住」，别把它当成守卫已经生效了。

on:
  pull_request:
  push:
    branches: [main]

# 不许加 paths / paths-ignore：哪天它被钉成必需检查，被 workflow 级过滤跳过的 PR 上
# 这个检查根本不会产生，表现为永远 pending、那个 PR 永远合不了。
# 这条禁令在各消费仓的 test.yml 上是同一条。

permissions:
  contents: read

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # **`fetch-tags: true` 不是可选的**：`actions/checkout` 默认 `fetch-tags: false`，
      # 工作副本里一个 tag 都没有，而 qa-gate.test.js 的 W8 要按 tag 读内容
      # （「内层 `uses:` 指的那个 tag 上真的有这个动作吗」）。没有 tag 时它会把
      # **每一次**都当成「前向引用」放过去——包括引用了一个真实存在、内容却对不上的
      # 旧 tag，也就是 dev-infra#3 修的那个 bug 本身。
      # 拿掉这一行，W8 会红（它自己钉着这个前提），不会静默变瞎。
      # `fetch-depth` 保持默认的 1：只多取 tag 的引用，不要历史。
      - uses: actions/checkout@v7
        with:
          fetch-tags: true

      # 不加 setup-node：这些脚本零依赖、只用 fs / path / child_process，
      # 而且**生产上它们跑在 runner 自带的 node 上**（组合动作里没有 setup-node，
      # 加了就要求每个消费仓的 job 多跑一步）。这里也用自带的那个，
      # 两边才是同一个环境——钉一个这里有、那里没有的版本反而制造了差异。
      - name: QA 门禁判定
        run: node .github/actions/qa-gate/qa-gate.test.js
